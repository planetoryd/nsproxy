[package]
name = "diag"
version = "0.1.1"
edition = "2021"
license.workspace = true

[dependencies]
anyhow = "1.0.100"
bincode = "1.3.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["net", "io-util", "sync", "rt", "macros", "time", "fs"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["registry"] }
flume.workspace = true
nsproxy-common = { version = "0.1.0", path = "../common" }
socks5-impl = { workspace = true }
nix = { version = "0.27.1", features = ["sched"] }
futures = "0.3.31"
rand = "0.8"
uzers = "0.12"

[features]
default = ["egui-client"]
egui-client = ["dep:eframe", "dep:egui", "dep:egui_extras"]

[dependencies.eframe]
version = "0.31"
optional = true

[dependencies.egui]
version = "0.31"
optional = true

[dependencies.egui_extras]
version = "0.31"
optional = true

[[bin]]
name = "nsp-diag"
path = "src/bin/viewer.rs"
required-features = ["egui-client"]
