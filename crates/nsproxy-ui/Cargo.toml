[package]
name = "nsproxy-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.5.46", features = ["derive"] }
egui = "0.33.3"
eframe = "0.33.3"
tokio = { version = "1.47.1", features = ["macros", "rt", "rt-multi-thread", "sync", "signal", "time", "process", "io-util", "net"] }
tracing = "0.1.44"
nsproxy-common = { version = "0.1.0", path = "../common" }
flume = "0.11.1"
egui_extras = "0.33"
egui_json_tree = "0.14.2"
nsproxy-core = { version = "0.3.5", path = "../nsproxy-core" }
diag = { version = "0.1.1", path = "../diag" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.27.1", features = ["process", "signal"] }
libc = "0.2"
egui_plot = "0.34.1"
bincode = "1.3"
egui_code_editor = "0.2.20"
egui-phosphor = "0.11"
which.workspace = true
notify = "8.2.0"
egui_sgr = "0.1.6"
rand = "0.8"
futures = "0.3"
shlex = "1.3"
zbus = "4.4"
alacritty_terminal = "0.25.1"
smallstr = "0.3.1"
term-view = { version = "0.3.5", path = "../term-view", default-features = false }
twox-hash = { version = "=2.1.2", features = ["xxhash3_128"] }
winit = "0.30.12"

[features]
default = [
	"term-view/egui-renderer",
	"term-view/alacritty-opengl",
	"x11",
	"wayland",
]
x11 = ["term-view/x11"]
wayland = ["term-view/wayland"]
