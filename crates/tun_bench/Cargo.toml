[package]
name = "tun_bench"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.31"
tokio = "1.47.1"
socks5-impl = { package = "nsproxy-socks5-impl", version = "0.5.6", path = "../socks5-impl" }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
nsproxy-core = { version = "0.3.5", path = "../nsproxy-core" }
anyhow = "1.0.99"
reqwest = { version = "0.12.23", features = ["socks"] }
clap = "4.5.46"
clap_complete = "4.5.57"
clap_complete_nushell = "4.5.8"
rlimit = "0.10.2"
rand = "0.9.2"

[profile.release]
opt-level = 3
